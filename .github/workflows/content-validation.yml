name: Content Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository structure validation
        id: repo_validate
        continue-on-error: true
        run: python3 tools/validate.py

      - name: PII detection (self-test)
        id: pii_self_test
        continue-on-error: true
        run: python3 tools/detect-pii.py --self-test

      - name: PII detection (content scan)
        id: pii_scan
        continue-on-error: true
        run: |
          python3 tools/detect-pii.py --dir docs
          python3 tools/detect-pii.py --dir libraries
          python3 tools/detect-pii.py --dir modules
          python3 tools/detect-pii.py --dir templates
          python3 tools/detect-pii.py --dir examples
          python3 tools/detect-pii.py --dir checklists

      - name: Markdown link check
        id: link_check
        continue-on-error: true
        run: python3 tools/check-links.py

      - name: Content audit
        id: content_audit
        continue-on-error: true
        run: python3 tools/content-audit.py

      - name: Version consistency check
        id: version_check
        continue-on-error: true
        run: sh tools/version-check.sh

      - name: Schema validation
        id: schema_validate
        continue-on-error: true
        run: python3 tools/validate-schema.py

      - name: E2E tests
        id: e2e_tests
        continue-on-error: true
        run: sh tests/run-e2e-tests.sh

      - name: Performance smoke test (optional)
        id: perf_check
        if: contains(github.event.pull_request.labels.*.name, 'run-performance-check')
        continue-on-error: true
        run: sh tests/run-all-tests.sh --quick

      - name: Report failures on PR
        if: >-
          steps.repo_validate.outcome == 'failure' ||
          steps.pii_self_test.outcome == 'failure' ||
          steps.pii_scan.outcome == 'failure' ||
          steps.link_check.outcome == 'failure' ||
          steps.content_audit.outcome == 'failure' ||
          steps.version_check.outcome == 'failure' ||
          steps.schema_validate.outcome == 'failure' ||
          steps.e2e_tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const checks = [
              ["Repository structure validation", "${{ steps.repo_validate.outcome }}"],
              ["PII detection self-test", "${{ steps.pii_self_test.outcome }}"],
              ["PII content scan", "${{ steps.pii_scan.outcome }}"],
              ["Markdown link check", "${{ steps.link_check.outcome }}"],
              ["Content audit", "${{ steps.content_audit.outcome }}"],
              ["Version consistency check", "${{ steps.version_check.outcome }}"],
              ["Schema validation", "${{ steps.schema_validate.outcome }}"],
              ["E2E tests", "${{ steps.e2e_tests.outcome }}"],
            ];
            const failed = checks.filter(([, outcome]) => outcome === "failure");
            const lines = checks.map(([name, outcome]) => {
              const mark = outcome === "failure" ? "❌" : outcome === "success" ? "✅" : "⚪";
              return `- ${mark} ${name}`;
            });
            const body = [
              "### 内容校验未通过 / Content validation failed",
              "",
              `以下 ${failed.length} 项检查未通过，请在提交前脱敏并修正：`,
              "",
              ...lines,
              "",
              "详情请查看本次运行的 Actions 日志。",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if any check failed
        if: >-
          steps.repo_validate.outcome == 'failure' ||
          steps.pii_self_test.outcome == 'failure' ||
          steps.pii_scan.outcome == 'failure' ||
          steps.link_check.outcome == 'failure' ||
          steps.content_audit.outcome == 'failure' ||
          steps.version_check.outcome == 'failure' ||
          steps.schema_validate.outcome == 'failure' ||
          steps.e2e_tests.outcome == 'failure'
        run: |
          echo "One or more content validation checks failed. See job steps above."
          exit 1
